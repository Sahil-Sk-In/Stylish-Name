name: Build and Release Name Maker APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Release and Debug APKs
      run: gradle assembleRelease assembleDebug --stacktrace

    - name: Rename APKs for Release
      run: |
        cp app/build/outputs/apk/release/app-release.apk NameMaker-v3.2.0-Release-Signed.apk
        cp app/build/outputs/apk/debug/app-debug.apk NameMaker-v3.2.0-Debug.apk

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NameMaker-APKs
        path: |
          NameMaker-v3.2.0-Release-Signed.apk
          NameMaker-v3.2.0-Debug.apk

    - name: Publish to GitHub Releases Page
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.2.0
        name: "Name Maker v3.2.0 (Custom Icon, Instant Launch, Clean Studio & Curated Styles)"
        body: |
          ### Name Maker v3.2.0 - Complete Offline Release

          **Download:** Download `NameMaker-v3.2.0-Release-Signed.apk` from **Assets** below and install directly on Android.

          ---
          #### What's New in v3.2.0:
          - **New Custom App Icon & Instant Dark Launch:** Custom luxury crown fountain-pen monogram icon across all adaptive/legacy densities, deep Royal Purple splash screen (zero white flash on startup), background asset/font preloading, and smooth entrance animations.
          - **Clean UI & Two Focused Themes:** Streamlined bottom navigation (**Home** & **Catalog**), **Royal Purple** and **AMOLED Black** themes, clean sidebar drawer, and **OPEN STUDIO** hero launch button.
          - **Professional Name Maker Studio:** Focused 8-button toolbar (`Undo`, `Redo`, `Left`, `Right`, `Space`, `Paste`, `Del`, `Clear`), dedicated corner `Save` & `Copy` buttons, 12 clean studio tabs, long-press any symbol to save into the **SAVED** tab, long-press editor box to save finished names, and an animated 3-step first-time coachmark guide.
          - **Clean Catalog & Saved Tab:** Curated **2,536 Stylish Names** and **523 Bios & Quotes** (all chat/bot artifacts removed) plus a live **Saved ★** tab.
          - **Expanded Curated Assets:** **112 Intros** & **122 Outros** (including 130 handcrafted new designs), **2,324 A–Z Alphabet styles** enriched with clean Unicode/confusable variants, rendered with 15 bundled Noto script & math fonts (100% offline, signed release).
        files: |
          NameMaker-v3.2.0-Release-Signed.apk
          NameMaker-v3.2.0-Debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
