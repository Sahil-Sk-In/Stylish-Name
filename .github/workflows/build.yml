name: Build and Release Name Maker APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Release and Debug APKs
      run: gradle assembleRelease assembleDebug --stacktrace

    - name: Rename APKs for Release
      run: |
        cp app/build/outputs/apk/release/app-release.apk NameMaker-v3.0.0-Release-Signed.apk
        cp app/build/outputs/apk/debug/app-debug.apk NameMaker-v3.0.0-Debug.apk

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NameMaker-APKs
        path: |
          NameMaker-v3.0.0-Release-Signed.apk
          NameMaker-v3.0.0-Debug.apk

    - name: Publish to GitHub Releases Page
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.0.0
        name: "Name Maker v3.0.0 (17,031+ Styles, Names, Bios & Tab Copy)"
        body: |
          ### Name Maker v3.0.0 - Complete Offline Release

          **Download:** Download `NameMaker-v3.0.0-Release-Signed.apk` from **Assets** below and install directly on Android.

          ---
          #### What's New in v3.0.0:
          - **Master Curated Database (17,031+ Items across 19 Sections):**
            - **4,419 Stylish Names** (extracted, cleaned, and deduplicated)
            - **731 Bios, Quotes, Shayari & Wishes** (separated cleanly into full-width list view)
            - **126 Dividers & Borders**, plus dedicated **Intro (47)**, **Outro (57)**, **Urdu (17)**, **Decorations (23)**, **Little ABC (176)**, **Stars (67)**, **Sets (78)**, **Combining (877)**, **Symbols (1,143)**, **Letters (1,872)**, **Marks (1,044)**, **Scripts (404)**, **Unicode (5,751)**, and **Blank Spaces (46)**.
          - **One-Click Tab Copy:** Tap Copy when the editor is empty (or long-press any tab / copy button) to copy all items from the active tab at once.
          - **100% Pure English & Offline:** Zero network calls, zero login/activation locks, 29 bundled Noto fonts, and signed with the permanent release keystore (`v3.0.0` updates smoothly over `v1.0.0` / `v2.0.0`).
        files: |
          NameMaker-v3.0.0-Release-Signed.apk
          NameMaker-v3.0.0-Debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
