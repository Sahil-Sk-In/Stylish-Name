name: Build and Release Name Maker APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Release and Debug APKs
      run: gradle assembleRelease assembleDebug --stacktrace

    - name: Rename APKs for Release
      run: |
        cp app/build/outputs/apk/release/app-release.apk NameMaker-v1.0.0-Release-Signed.apk
        cp app/build/outputs/apk/debug/app-debug.apk NameMaker-v1.0.0-Debug.apk

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NameMaker-APKs
        path: |
          NameMaker-v1.0.0-Release-Signed.apk
          NameMaker-v1.0.0-Debug.apk

    - name: Publish to GitHub Releases Page
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Name Maker v1.0.0 (Official Release)"
        body: |
          ### 🎉 Name Maker v1.0.0 - Official Production Release
          
          **Download:** Download the `NameMaker-v1.0.0-Release-Signed.apk` file from **Assets** below and install it directly on your Android phone.

          ---
          #### 🌟 Key Features:
          - 🔑 **Permanent Production Signature:** Signed with a permanent Keystore (valid through 2054) ensuring zero package/signature conflict on future updates.
          - 🚫 **No Activation Lock / Tamper Guard Bypassed:** Operates independently without server locks or activation keys.
          - ⚡ **100% Offline & Instant Loading (0ms):** Over 30+ stylish Unicode and TTF fonts, symbols, and VIP bios/names generator work completely offline.
          - 💎 **Modern Architecture:** Built with pure Kotlin, Jetpack Compose, and Material 3 Dark AMOLED theme.
        files: |
          NameMaker-v1.0.0-Release-Signed.apk
          NameMaker-v1.0.0-Debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
