name: Build and Release Name Maker APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Release and Debug APKs
      run: gradle assembleRelease assembleDebug --stacktrace

    - name: Rename APKs for Release
      run: |
        cp app/build/outputs/apk/release/app-release.apk NameMaker-v3.1.0-Release-Signed.apk
        cp app/build/outputs/apk/debug/app-debug.apk NameMaker-v3.1.0-Debug.apk

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NameMaker-APKs
        path: |
          NameMaker-v3.1.0-Release-Signed.apk
          NameMaker-v3.1.0-Debug.apk

    - name: Publish to GitHub Releases Page
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.1.0
        name: "Name Maker v3.1.0 (Exact Salaam S2 Palette, Updates & 17,031+ Styles)"
        body: |
          ### Name Maker v3.1.0 - Complete Offline Release

          **Download:** Download `NameMaker-v3.1.0-Release-Signed.apk` from **Assets** below and install directly on Android.

          ---
          #### What's New in v3.1.0:
          - **Exact Video Blueprint UI Alignment:** Authentic Salaam Pink (`#FAF0F0` blush background, `#1F1A2C` deep indigo headers/nav, `#E898A8` rose pink accents), **Updates** screen with **Salaam** and **For You** tabs (with long-press one-click tab copy).
          - **Master Curated Database (17,031+ Items across 19 Sections):**
            - **4,419 Stylish Names** & **731 Bios, Quotes, Shayari & Wishes**
            - **126 Dividers**, **Intro (47)**, **Outro (57)**, **Urdu (17)**, **Decorations (23)**, **Little ABC (176)**, **Stars (67)**, **Sets (78)**, **Combining (877)**, **Symbols (1,143)**, **Letters (1,872)**, **Marks (1,044)**, **Scripts (404)**, **Unicode (5,751)**, and **Blank Spaces (46)**.
          - **100% Pure English & Offline:** Zero network calls, zero login/activation locks, 29 bundled Noto fonts, signed with permanent release keystore.
        files: |
          NameMaker-v3.1.0-Release-Signed.apk
          NameMaker-v3.1.0-Debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
