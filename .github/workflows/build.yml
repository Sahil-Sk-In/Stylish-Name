name: Build Name Maker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Release and Debug APKs
      run: gradle assembleRelease assembleDebug --stacktrace

    - name: Upload Release APK (Permanent Signed)
      uses: actions/upload-artifact@v4
      with:
        name: NameMaker-Release-Signed-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NameMaker-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
